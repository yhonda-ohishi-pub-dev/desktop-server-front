name: Release Frontend

on:
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

    - name: Create release archive
      run: |
        cd dist
        tar -czf ../desktop-server-frontend-${{ github.ref_name }}.tar.gz .
        cd ..

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: desktop-server-frontend-${{ github.ref_name }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
