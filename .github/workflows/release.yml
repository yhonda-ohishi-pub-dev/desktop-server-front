name: Release Frontend

on:
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

    - name: Create release archive
      shell: pwsh
      run: |
        Compress-Archive -Path dist/* -DestinationPath "desktop-server-frontend-${{ github.ref_name }}.zip"

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: desktop-server-frontend-${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
